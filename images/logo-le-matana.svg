<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 228" role="img" aria-label="Le Matana, restaurant italien">
  <!-- Logo recréé d'après l'enseigne. Version autonome (fond brun) pour les réseaux / impressions.
       Le site utilise la même construction en SVG intégré dans index.html. -->
  <rect width="340" height="228" fill="#2B1D17"/>
  <g fill="#E8DCC6" transform="translate(86.6 -37.8) scale(2.6)">
    <rect x="17" y="19" width="3.2" height="62"/>
    <polygon points="17,19 30,19 54,71 50.5,84"/>
    <polygon points="48.6,84 51.8,84 78,19 75,19"/>
    <rect x="72" y="19" width="12" height="62"/>
    <rect x="9" y="17.6" width="21" height="1.8"/>
    <rect x="69" y="17.6" width="23" height="1.8"/>
    <rect x="10" y="80.6" width="17" height="1.8"/>
    <rect x="65" y="80.6" width="27" height="1.8"/>
  </g>
  <g font-family="Jost, Futura, 'Century Gothic', Arial, sans-serif" font-weight="500" fill="#F5EFE4"
     stroke="#2B1D17" stroke-width="5" paint-order="stroke" stroke-linejoin="round">
    <text x="12" y="112" font-size="44" letter-spacing="1">LE</text>
    <text x="100" y="126" font-size="46" letter-spacing="1">MATANA</text>
  </g>
  <text x="200" y="210" text-anchor="middle" font-family="Jost, Futura, Arial, sans-serif" font-weight="400"
        font-size="14" letter-spacing="2.6" fill="#F5EFE4">RESTAURANT ITALIEN</text>
  <circle cx="318" cy="205" r="8" fill="none" stroke="#F5EFE4" stroke-width="1.4"/>
  <text x="318" y="209.5" text-anchor="middle" font-family="Jost, Arial, sans-serif" font-weight="500" font-size="11" fill="#F5EFE4">K</text>
</svg>
